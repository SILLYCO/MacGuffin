name: Keep Supabase Database Active

on:
  schedule:
    # Runs every 2 days at 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-database:
    name: Ping Database Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Health Request to Vercel
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://macguffin-ivory.vercel.app/api/health")
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          echo "Response Body: $body"
          echo "HTTP Status: $status"
          if [ "$status" -ne 200 ]; then
            echo "Health check failed with status $status"
            exit 1
          fi
          echo "Supabase database kept alive successfully!"
