version: "3.8"

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: it-asset-go2rtc
    restart: unless-stopped
    # Use host network mode on Linux for zero-latency LAN access to the Dahua DVR
    # and direct WebRTC UDP peer connectivity.
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    environment:
      - TZ=Africa/Cairo
